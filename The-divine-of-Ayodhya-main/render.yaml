services:
  - type: web
    name: divine-ayodhya-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: divine-ayodhya-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm run build
    startCommand: npx serve -s dist -l 3000
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          name: divine-ayodhya-api
          property: url
      - key: VITE_RAZORPAY_KEY_ID
        value: rzp_live_RgUpx3CB4OtecR
